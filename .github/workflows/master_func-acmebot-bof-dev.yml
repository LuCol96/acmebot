name: Build and deploy dotnet core project to Azure Function App - func-acmebot-bof-dev

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '24.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout GitHub Action
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/Acmebot.App/ClientApp/package-lock.json

      - name: Build Dashboard
        working-directory: ./src/Acmebot.App/ClientApp
        run: |
          npm ci
          npm run build

      - name: Publish Backend
        run: dotnet publish -c Release --no-self-contained -o ./output ./src/Acmebot.App

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_CAAAA02198C44C9BA4AD3B3A2A440280 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_DE7FC6A4217B486FA1F40E259D9FA76A }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_17516C693206493FB40B3696AE0F8991 }}

      - name: Run Azure Functions Action
        uses: Azure/functions-action@v1
        with:
          app-name: 'func-acmebot-bof-dev'
          slot-name: 'Production'
          package: './output'
